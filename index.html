<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
:root{--blue:#A8C5E6;--pink:#F4B3C2;--yellow:#FFE34D;--ink:#26324d;--ink2:#52617f;--paper:#EEF4FB;--card:#fff;--ok:#43b77a;--bad:#ea5d72;--blue-d:#6c9bd0;--pink-d:#dd7a94;--yel-d:#e0bd00;--fd:'Fredoka','Trebuchet MS',system-ui,sans-serif;--fb:'Nunito','Segoe UI',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:600 15px/1.4 var(--fb);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 28px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance}
.wrap{max-width:980px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--blue);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-radius:0 0 22px 22px;box-shadow:0 4px 0 var(--blue-d)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--blue)}
.logo{font:700 22px var(--fd);letter-spacing:.5px;margin-right:auto;display:flex;gap:6px;align-items:center}
.pill{background:var(--yellow);border-radius:99px;padding:5px 12px;font:600 16px var(--fd);box-shadow:0 3px 0 var(--yel-d);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.sp{background:var(--pink);box-shadow:0 3px 0 var(--pink-d)}
.btn{border:0;border-radius:16px;padding:8px 16px;font:600 16px var(--fd);background:var(--pink);box-shadow:0 4px 0 var(--pink-d);cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink-d)}
.btn.y{background:var(--yellow);box-shadow:0 4px 0 var(--yel-d)}
.btn.b{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.sm{padding:5px 10px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 5px 0 #d5e3f3}
.grid{display:grid;gap:16px}
.home{grid-template-columns:minmax(0,320px) minmax(0,1fr);margin-top:20px}
@media(max-width:720px){.home{grid-template-columns:minmax(0,1fr)}}
.petcard{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(var(--pink),#f9d3dc)}
.stage{position:relative;margin:auto;animation:bob 2.4s ease-in-out infinite}
.stage .pet{position:absolute;inset:0;display:grid;place-items:center;line-height:1}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.stage .fx{position:absolute;inset:0;pointer-events:none}
.stage .fx i{position:absolute;font-style:normal;animation:fx 1.4s ease-in infinite}
.fxgold{filter:drop-shadow(0 0 8px #ffd500)}
.fxrad{filter:drop-shadow(0 0 9px #6dff3a)}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes fx{0%{opacity:0;transform:translateY(10px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1.1)}}
.bar{height:14px;border-radius:99px;background:#0001;overflow:hidden}
.bar>b{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .3s}
.bar.low>b{background:var(--bad)}
.stat{width:100%;display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;text-align:left}
.menu{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.gcard{border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--card);border-radius:22px;padding:16px;box-shadow:0 5px 0 #d5e3f3;transition:transform .15s}
.gcard:hover{transform:translateY(-4px) rotate(-.6deg)}
.gcard .ic{font-size:36px}
.gcard h3{font-size:20px}
.gcard small{color:var(--ink2);font-weight:600}
.gcard .lv{align-self:flex-start;background:var(--blue);border-radius:99px;padding:2px 10px;font:600 13px var(--fd)}
.gcard.pv{background:var(--yellow);box-shadow:0 5px 0 var(--yel-d)}
.shell{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.shead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shead h2{margin-right:auto;font-size:24px}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.hud span{background:var(--blue);border-radius:99px;padding:4px 12px;font:600 15px var(--fd);font-variant-numeric:tabular-nums}
canvas{display:block;width:100%;max-width:100%;border-radius:20px;background:#dbe8f6;touch-action:none}
.ovl{position:fixed;inset:0;z-index:50;background:#26324dcc;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:26px;padding:20px;width:min(780px,100%);max-height:88vh;overflow:auto;box-shadow:0 8px 0 #0003}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tab{border:0;border-radius:99px;padding:6px 14px;background:var(--blue);cursor:pointer;font:600 15px var(--fd)}
.tab.on{background:var(--yellow);box-shadow:0 3px 0 var(--yel-d)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.it{background:var(--paper);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;min-width:0}
.it .pv{width:64px;height:64px;display:grid;place-items:center;font-size:36px}
.it b{font:600 15px var(--fd)}
.it small{color:var(--ink2);font-size:12px}
.it.lock{opacity:.7}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp{border:3px solid var(--blue);border-radius:14px;padding:8px 12px;background:#fff;font:600 20px var(--fd);width:160px;max-width:100%}
.msg{min-height:1.4em;font-weight:800}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.pick button{border:0;background:var(--card);border-radius:20px;padding:12px;cursor:pointer;font:600 15px var(--fd);box-shadow:0 5px 0 #d5e3f3;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick button span{display:block;line-height:0}.pick .stage{animation:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:10px 20px;z-index:80;font:600 16px var(--fd);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.cu{background:var(--card);border:3px solid transparent;border-radius:18px;padding:10px;width:132px;text-align:center;cursor:pointer;box-shadow:0 4px 0 #d5e3f3}
.cu.sel{border-color:var(--pink-d)}
.cu .f{font-size:38px}
.cu.vip{background:#fff7c2}
.order{background:var(--card);border-radius:18px;padding:14px;border:3px dashed var(--pink)}
.shortc{position:absolute;inset:0;display:grid;place-items:center;background:#ea5d7266;border-radius:20px;z-index:3}
.rel{position:relative}
.alien{font-size:64px;display:inline-block;animation:bob 1s ease-in-out infinite}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.pc{border:3px solid transparent;border-radius:16px;padding:8px;background:var(--card);cursor:pointer;text-align:center;box-shadow:0 4px 0 #d5e3f3;min-width:0}
.pc:hover{border-color:var(--ink)}
.pc .t{font-size:26px}
.pc b{display:block;font:600 14px var(--fd)}
.pc small{color:var(--ink2);font-size:12px;display:block}
.hint{background:#fff6bf;border-radius:14px;padding:8px 12px;margin-top:8px;display:flex;flex-direction:column;gap:4px;color:#4a3d00;font-weight:700}
.mv{border:3px solid transparent;border-radius:16px;padding:8px;background:var(--card);cursor:pointer;text-align:left;box-shadow:0 4px 0 #d5e3f3;display:flex;flex-direction:column;gap:2px;min-width:0}
.mv b{font:600 15px var(--fd)}.mv small{color:var(--ink2);font-size:12px}
.mv:hover:not([disabled]){border-color:var(--ink)}
.mv[disabled]{opacity:.45;cursor:not-allowed}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 14px}
.petcard small{display:block}
.petcard h2 small{display:inline;font-size:15px;color:var(--ink2)}
[hidden]{display:none!important}
.pet-type-badge{position:absolute;top:-4px;right:-4px;background:var(--yellow);border:2px solid var(--ink);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 0 var(--yel-d);z-index:5}

/* Styles for Missions & Skill Tree */
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px}
.sk-card{background:var(--paper);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 0 #d5e3f3}
.sk-card h4{font:700 16px var(--fd);margin:0;display:flex;align-items:center;gap:6px}
.sk-card p{margin:0;font-size:12px;color:var(--ink2);flex:1}
.sk-card .badge{font-size:11px;background:var(--blue);padding:2px 8px;border-radius:99px;align-self:flex-start;font-weight:700}
.m-card{background:var(--paper);border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:10px;box-shadow:0 3px 0 #d5e3f3}
.m-card .ic{font-size:32px;background:#fff;border-radius:14px;padding:6px;display:grid;place-items:center}
.m-info{flex:1}
.m-info h4{margin:0;font:700 16px var(--fd)}
.m-info p{margin:2px 0 6px;font-size:13px;color:var(--ink2)}
.act-bar{display:flex;gap:8px;position:absolute;top:10px;right:10px;z-index:10}
.act-btn{border:2px solid var(--ink);border-radius:99px;padding:4px 10px;font:700 13px var(--fd);background:var(--yellow);cursor:pointer;box-shadow:0 3px 0 var(--yel-d)}
.act-btn[disabled]{opacity:.5;cursor:not-allowed}
</style>
<div class="top">
  <div class="logo">🧮 Mate Mascotas</div>
  <span class="pill" id="coins">🪙 100</span>
  <span class="pill sp" id="sp_points">⚡ 0 SP</span>
  <button class="btn sm y" id="missbtn" aria-label="Misiones">📜 Misiones</button>
  <button class="btn sm b" id="treebtn" aria-label="Habilidades">🌳 Habilidades</button>
  <button class="btn sm y" id="cartbtn" aria-label="Tienda">🛒</button>
  <button class="btn sm b" id="homebtn" aria-label="Inicio">🏠</button>
  <button class="btn sm" id="mutebtn" aria-label="Sonido">🔊</button>
</div>
<div class="wrap"><div id="view"></div></div>
<script>
'use strict';
/* ===== utils ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)];
const mk=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const r1=n=>Math.round(n*10)/10,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const num=v=>parseFloat(String(v).replace(',','.').trim());
const rd=n=>Math.round(n*100)/100;

/* ===== audio ===== */
const SFX=(()=>{
  let ctx;const urls={alarm:null,hit:null,coin:null,short:null,ok:null,bad:null,click:null,boom:null};
  const C=()=>ctx||(ctx=new(window.AudioContext||window.webkitAudioContext)());
  const tone=(f,d,type='sine',v=.15,slide=0,t0=0)=>{try{const c=C(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d)}catch(e){}};
  const noise=(d,v=.2)=>{try{const c=C(),b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=c.createBufferSource(),g=c.createGain();g.gain.value=v;s.buffer=b;s.connect(g).connect(c.destination);s.start()}catch(e){}};
  const synth={alarm:()=>{tone(880,.18,'square',.12);tone(660,.18,'square',.12,0,.2)},hit:()=>{tone(180,.12,'triangle',.25,-90);noise(.08,.15)},coin:()=>{tone(988,.08,'square',.1);tone(1319,.18,'square',.1,0,.08)},short:()=>{noise(.35,.25);tone(300,.3,'sawtooth',.12,-200)},ok:()=>{tone(523,.1,'triangle',.18);tone(784,.16,'triangle',.18,0,.1)},bad:()=>{tone(220,.25,'sawtooth',.14,-120)},click:()=>tone(660,.05,'triangle',.1),boom:()=>{noise(.5,.3);tone(90,.4,'sine',.3,-50)}};
  return{urls,play(n){if(S&&S.mute)return;const u=urls[n];if(u){try{new Audio(u).play();return}catch(e){}}(synth[n]||(()=>{}))()}}
})();

/* ===== persistence ===== */
const KEY='mathpets_v2';let S=null;
const defState=()=>({
  coins:100,sp:0,pet:null,own:{skins:{},items:[],cards:['pebble','papercut','snip']},
  eq:{},skills:{},hunger:80,thirst:80,t:Date.now(),
  prog:{g1:1,g2:1,g3:1,g4:1,pvp:1},best:{},mute:false,
  streak:0,lastLoginDate:null,missions:{date:null,list:[]}
});

const Store={
  load(){
    try{
      const r=localStorage.getItem(KEY);
      S=r?Object.assign(defState(),JSON.parse(r)):defState();
    }catch(e){S=defState()}
    if(S.pet){S.pet.lvl=S.pet.lvl||1;S.pet.xp=S.pet.xp||0}
    S.skills=S.skills||{};
    S.sp=S.sp||0;
    Missions.checkDaily();
  },
  save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},
  reset(){try{localStorage.removeItem(KEY)}catch(e){}S=defState();Store.save()}
};
const starving=()=>S.hunger<15||S.thirst<15;
const earn=(n,spGained=0)=>{
  n=Math.round(n*(starving()&&n>0?.5:1));
  S.coins=Math.max(0,S.coins+n);
  S.sp=(S.sp||0)+spGained;
  Store.save();UI.coins();
  if(n>0||spGained>0)SFX.play('coin');
  return n;
};
const Pet={
  need(l){return 30+l*20},
  stats(sp,l){const b=PETS[sp];return{hp:b.hp+7*(l-1),atk:b.atk+(l-1),def:b.def+Math.floor((l-1)/2),spd:r1(b.spd+(l-1)*.5)}},
  gain(xp){const p=S.pet;p.lvl=p.lvl||1;p.xp=(p.xp||0)+xp;let up=0;while(p.xp>=Pet.need(p.lvl)){p.xp-=Pet.need(p.lvl);p.lvl++;up++}Store.save();return up}
};
const Hint={html(list,n){return n>0?`<div class="hint">${list.slice(0,Math.min(n,list.length)).map(h=>`<div>💡 ${h}</div>`).join('')}</div>`:''}};
const UI={
  coins(){
    const e=$('#coins'),s=$('#sp_points');
    if(e)e.textContent='🪙 '+S.coins;
    if(s)s.textContent='⚡ '+(S.sp||0)+' SP';
  },
  toast(m){const t=mk(`<div class="toast">${m}</div>`);document.body.append(t);setTimeout(()=>t.remove(),2200)},
  modal(html,onclose){const o=mk(`<div class="ovl"><div class="modal">${html}</div></div>`);document.body.append(o);o.close=()=>{o.remove();onclose&&onclose()};o.addEventListener('mousedown',e=>{if(e.target===o)o.close()});return o}
};
setInterval(()=>{if(!S||!S.pet)return;S.hunger=clamp(S.hunger-1,0,100);S.thirst=clamp(S.thirst-1.4,0,100);Store.save();if(typeof Home!=="undefined")Home.stats()},12000);

/* ===== SKILL TREE DATA ===== */
const SKILLS={
  g1:[
    {id:'g1_carry',n:'Cargador Múltiple',max:3,desc:l=>`Permite llevar hasta ${l+1} cajas al mismo tiempo.`,cost:[2,3,4]},
    {id:'g1_guard',n:'Trampa / Perro Guardián',max:2,desc:l=>`Aturde a los ladrones ${l*2.5}s al tocar la zona o intentar robar.`,cost:[3,4]},
    {id:'g1_scan',n:'Escáner Parcial',max:1,desc:()=>'Destaca sutilmente si la caja es par o impar.',cost:[4]},
    {id:'g1_slow',n:'Freno de Cinta',max:1,desc:()=>'Activa un freno del 25% en las cajas por 12s (CD 45s).',cost:[3]},
    {id:'g1_laser',n:'Repelente Láser',max:1,desc:()=>'Ahuyenta a todos los ladrones en pantalla (CD 60s).',cost:[5]}
  ],
  g2:[
    {id:'g2_pat',n:'Paciencia de Hierro',max:3,desc:l=>`Aumenta la barra de paciencia de los clientes un +${[20,35,50][l-1]}%.`,cost:[2,3,4]},
    {id:'g2_slow',n:'Cámara Lenta Barista',max:1,desc:()=>'Reduce a la mitad la pérdida de paciencia por 15s (CD 60s).',cost:[4]},
    {id:'g2_vip',n:'Imán de Celebridades',max:2,desc:l=>`Aumenta la probabilidad de clientes VIP (pagan x2) un +${l*15}%.`,cost:[3,4]},
    {id:'g2_fast',n:'Clientes Expreso',max:2,desc:l=>`Mayor probabilidad (+${l*20}%) de clientes con pedidos sencillos.`,cost:[2,3]},
    {id:'g2_warn',n:'Calculadora Redondeo',max:1,desc:()=>'Alerta visual si tu respuesta está a menos de 0.1 del resultado.',cost:[3]}
  ],
  g3:[
    {id:'g3_tol',n:'Manos de Precisión',max:3,desc:l=>`Amplía la tolerancia de cálculo en +${l*0.2} cm.`,cost:[2,3,4]},
    {id:'g3_freeze',n:'Congelador de Placa',max:1,desc:()=>'Detiene el temporizador del circuito por 8s (CD 45s).',cost:[4]},
    {id:'g3_insul',n:'Aislante Cortocircuito',max:2,desc:l=>`Reduce la penalización por chispa no atajada a -${5-l*1.5}s.`,cost:[3,4]},
    {id:'g3_sub',n:'Visor de Sub-Segmentos',max:1,desc:()=>'Muestra marcas proporcionales visuales en la línea.',cost:[3]},
    {id:'g3_fuse',n:'Reiniciador Fusible',max:1,desc:()=>'Recupera 1 vida tras perderla en la placa (CD 90s).',cost:[5]}
  ],
  g4:[
    {id:'g4_trans',n:'Traductor Alienígena',max:3,desc:l=>`Desbloquea ${l} nivel(es) de pistas textuales avanzadas de inicio.`,cost:[2,3,4]},
    {id:'g4_shield',n:'Escudo Cuántico',max:1,desc:()=>'Evita la pérdida de vida en el primer fallo de la partida.',cost:[4]},
    {id:'g4_simp',n:'Disparador Simplificador',max:1,desc:()=>'Simplifica cifras a enteros menores proporcionalmente (CD 60s).',cost:[4]},
    {id:'g4_skip',n:'Sobrecarga Análisis',max:1,desc:()=>'Salta un problema compuesto cambiándolo por uno directo (1 uso).',cost:[3]},
    {id:'g4_bonus',n:'Condensador Galáctico',max:2,desc:l=>`Bono de +${l*25}% monedas al acertar a la primera sin pistas.`,cost:[3,4]}
  ]
};

function getSk(id){return S.skills[id]||0}

/* ===== MISSIONS & STREAKS ===== */
const MISSIONS_POOL=[
  {id:'m_cajas_5',g:'g1',desc:'Entrega 5 cajas en la Fábrica',target:5,c:30,sp:2},
  {id:'m_cajas_10',g:'g1',desc:'Entrega 10 cajas en la Fábrica',target:10,c:60,sp:4},
  {id:'m_barista_4',g:'g2',desc:'Atiende 4 clientes en el Barista',target:4,c:35,sp:2},
  {id:'m_barista_8',g:'g2',desc:'Atiende 8 clientes en el Barista',target:8,c:70,sp:5},
  {id:'m_cables_3',g:'g3',desc:'Repara 3 circuitos de Cables',target:3,c:40,sp:3},
  {id:'m_cables_6',g:'g3',desc:'Repara 6 circuitos de Cables',target:6,c:80,sp:5},
  {id:'m_gal_3',g:'g4',desc:'Abre 3 puertas en Escape Galáctico',target:3,c:45,sp:3},
  {id:'m_gal_5',g:'g4',desc:'Abre 5 puertas en Escape Galáctico',target:5,c:85,sp:6}
];

const Missions={
  checkDaily(){
    const today=new Date().toISOString().slice(0,10);
    if(S.lastLoginDate!==today){
      if(S.lastLoginDate){
        const last=new Date(S.lastLoginDate);
        const curr=new Date(today);
        const diff=(curr-last)/(1000*3600*24);
        if(diff===1) S.streak=(S.streak||0)+1;
        else if(diff>1) S.streak=1;
      }else{
        S.streak=1;
      }
      S.lastLoginDate=today;
    }
    if(!S.missions||S.missions.date!==today){
      const shuffled=[...MISSIONS_POOL].sort(()=>Math.random()-.5);
      S.missions={
        date:today,
        list:shuffled.slice(0,4).map(m=>({...m,prog:0,done:false}))
      };
    }
    Store.save();
  },
  track(gameId,amount=1){
    if(!S.missions||!S.missions.list)return;
    let changed=false;
    S.missions.list.forEach(m=>{
      if(m.g===gameId && !m.done){
        m.prog+=amount;
        if(m.prog>=m.target){
          m.prog=m.target;
          m.done=true;
          earn(m.c,m.sp);
          UI.toast(`🎯 ¡Misión cumplida! +${m.c}🪙 +${m.sp}SP`);
        }
        changed=true;
      }
    });
    if(changed)Store.save();
  },
  openModal(){
    this.checkDaily();
    const streakBonus=Math.min(10,S.streak*2);
    let html=`<h2>📜 Misiones Diarias</h2>
    <div style="background:var(--paper);padding:12px;border-radius:16px;margin:10px 0;display:flex;align-items:center;gap:12px">
      <span style="font-size:36px">🔥</span>
      <div><b>Racha Diaria: ${S.streak||1} día(s)</b><br><small style="color:var(--ink2)">Bono de racha activo: +${streakBonus} SP por día jugado</small></div>
    </div>
    <div style="margin-top:10px">`;

    S.missions.list.forEach(m=>{
      html+=`<div class="m-card">
        <div class="ic">${m.done?'✅':'📌'}</div>
        <div class="m-info">
          <h4>${m.desc}</h4>
          <p>Recompensa: 🪙 ${m.c} | ⚡ ${m.sp} SP</p>
          <div class="bar"><b style="width:${(m.prog/m.target)*100}%"></b></div>
        </div>
        <div><b>${m.prog}/${m.target}</b></div>
      </div>`;
    });
    html+=`</div><button class="btn b" id="close_m" style="width:100%;margin-top:10px">Cerrar</button>`;
    const m=UI.modal(html);
    $('#close_m',m).onclick=()=>m.close();
  }
};

const SkillTree={
  openModal(){
    let html=`<div class="row" style="justify-content:space-between">
      <h2>🌳 Árbol de Habilidades</h2>
      <span class="pill sp">⚡ ${S.sp||0} SP Disponibles</span>
    </div>
    <div class="tabs" id="sk_tabs">
      <button class="tab on" data-g="g1">📦 Cajas</button>
      <button class="tab" data-g="g2">☕ Barista</button>
      <button class="tab" data-g="g3">🔌 Cables</button>
      <button class="tab" data-g="g4">👽 Galáctico</button>
    </div>
    <div id="sk_content"></div>
    <button class="btn b" id="close_sk" style="width:100%;margin-top:14px">Cerrar</button>`;
    
    const m=UI.modal(html);
    $('#close_sk',m).onclick=()=>m.close();
    
    const renderBranch=gId=>{
      const list=SKILLS[gId]||[];
      let h=`<div class="st-grid">`;
      list.forEach(s=>{
        const lvl=getSk(s.id);
        const isMax=lvl>=s.max;
        const nextCost=isMax?0:s.cost[lvl];
        const canBuy=!isMax && (S.sp||0)>=nextCost;
        h+=`<div class="sk-card">
          <h4>${s.n}</h4>
          <span class="badge">Nivel ${lvl}/${s.max}</span>
          <p>${s.desc(Math.max(1,lvl))}</p>
          <button class="btn sm ${isMax?'b':canBuy?'y':''}" data-buy="${s.id}" ${!canBuy||isMax?'disabled':''}>
            ${isMax?'Máximo':`Mejorar (⚡ ${nextCost} SP)`}
          </button>
        </div>`;
      });
      h+=`</div>`;
      $('#sk_content',m).innerHTML=h;
      $$('[data-buy]',m).forEach(btn=>{
        btn.onclick=()=>{
          const skId=btn.dataset.buy;
          const sObj=list.find(x=>x.id===skId);
          const currentLvl=getSk(skId);
          const cost=sObj.cost[currentLvl];
          if((S.sp||0)>=cost){
            S.sp-=cost;
            S.skills[skId]=currentLvl+1;
            Store.save();
            UI.coins();
            SFX.play('coin');
            UI.toast(`¡Habilidad mejorada: ${sObj.n}!`);
            renderBranch(gId);
          }
        };
      });
    };

    renderBranch('g1');
    $$('#sk_tabs .tab',m).forEach(t=>{
      t.onclick=()=>{
        $$('#sk_tabs .tab',m).forEach(x=>x.classList.remove('on'));
        t.classList.add('on');
        renderBranch(t.dataset.g);
      };
    });
  }
};

  hud(o){$('#hud').innerHTML=Object.entries(o).map(([k,v])=>`<span>${k} ${v}</span>`).join('')},
  end({title,lines,coins,xp,again}){const c=earn(coins);const gx=xp!=null?xp:Math.max(6,Math.abs(coins));const up=Pet.gain(gx);lines=[...lines,`⭐ +${gx} XP${up?` · ¡${S.pet.name} sube a nivel ${S.pet.lvl}!`:''}`];if(up)SFX.play('coin');const m=UI.modal(`<h2>${title}</h2><p>${lines.join('<br>')}</p><p class="pill" style="display:inline-block">${c>=0?'+':''}${c} 🪙</p><div class="row" style="margin-top:14px"><button class="btn y" id="ag">Jugar otra vez</button><button class="btn b" id="mn">Menú</button></div>`);$('#ag',m).onclick=()=>{m.close();again()};$('#mn',m).onclick=()=>{m.close();App.home()}}
};

function place(sp,it){
  const t=SPT[sp],a=ANCH[sp];if(!a)return'';
  if(it.slot==='hands')return a.hands&&it.hand?'<g transform="translate('+t[1]+' '+t[2]+') scale('+t[0]+')">'+a.hands.map(q=>it.hand(q[0],q[1],q[2])).join('')+'</g>':'';
  const p=a[it.slot],r=REF[it.slot];if(!p||!it.svg)return'';
  const sx=p.w/r[2]*t[0],sy=(p.h?p.h/r[3]:p.w/r[2])*t[0];
  return '<g transform="translate('+rd(p.x*t[0]+t[1])+' '+rd(p.y*t[0]+t[2])+') scale('+rd(sx)+' '+rd(sy)+') translate('+(-r[0])+' '+(-r[1])+')">'+it.svg+'</g>';
}

const PIMG={};const pimg=sp=>PIMG[sp]||(PIMG[sp]=Object.assign(new Image(),{src:spriteURL(sp)}));

function petHTML(size,o={}){
  const sp=o.sp||S.pet.sp,sk=skinOf(sp,o.skin!=null?o.skin:S.pet.skin),eq=o.eq||S.eq;
  const ids=Object.values(eq).filter(Boolean).map(i=>ITEM[i]).filter(i=>i&&canWear(sp,i));
  const back=ids.filter(i=>i.slot==='back').map(i=>place(sp,i)).join('');
  const front=SLOTS.filter(s=>s!=='back').map(s=>ids.find(i=>i.slot===s)).filter(Boolean).map(i=>place(sp,i)).join('');
  const fx=ids.find(i=>i.slot==='fx');
  const fxh=fx?`<div class="fx">${fx.fx.map((e,k)=>`<i style="left:${18+k*28+rnd(0,8)}%;top:${30+rnd(0,40)}%;animation-delay:${k*.45}s;font-size:${size*.16}px">${e}</i>`).join('')}</div>`:'';
  const flt=[sk.f,o.sad?'grayscale(.7) brightness(.92)':''].filter(Boolean).join(' ');
  const badge=o.showBadge&&PETS[sp]?`<div class="pet-type-badge" title="Tipo ${PETS[sp].type}">${TYPE[PETS[sp].type].e}</div>`:'';
  const tear=o.sad?'<svg viewBox="0 0 200 200"><text x="150" y="42" font-size="34">😢</text></svg>':'';
  return `<div class="stage ${fx&&fx.cls||''}" style="width:${size}px;height:${size}px">${badge}<svg viewBox="0 0 200 200">${back}</svg><div class="pet" style="${flt?`filter:${flt}`:''}"><svg viewBox="0 0 200 200">${SPR[sp]}</svg></div><svg viewBox="0 0 200 200">${front}</svg>${tear}${fxh}</div>`;
}

'use strict';
/* ---- divisibility rules ---- */
const dsum=n=>[...String(n)].reduce((a,c)=>a+ +c,0);
const dgs=n=>[...String(n)].join('+')+' = '+dsum(n);
const DIV={
 2:{r:'termina en 0, 2, 4, 6 u 8',w:n=>`${n} termina en ${n%10}`},
 3:{r:'la suma de sus cifras es múltiplo de 3',w:n=>`cifras: ${dgs(n)}`},
 4:{r:'sus 2 últimas cifras forman un múltiplo de 4',w:n=>`2 últimas cifras: ${n%100}`},
 5:{r:'termina en 0 o en 5',w:n=>`${n} termina en ${n%10}`},
 6:{r:'es par y la suma de sus cifras es múltiplo de 3',w:n=>`termina en ${n%10}; cifras: ${dgs(n)}`},
 8:{r:'su mitad, la mitad de la mitad y otra mitad siguen siendo enteras',w:n=>`mitades: ${n/2} → ${n/4} → ${n/8}`},
 9:{r:'la suma de sus cifras es múltiplo de 9',w:n=>`cifras: ${dgs(n)}`},
 10:{r:'termina en 0',w:n=>`${n} termina en ${n%10}`}
};
const divRule=d=>DIV[d]||{r:`aparece en la tabla del ${d}`,w:n=>`${n} = ${d}×${Math.floor(n/d)} + ${n%d}`};
const TIERS=[[2,5,3,10],[4,6,9,12],[8,10,6,4]];
const tierOf=l=>Math.min(TIERS.length-1,Math.floor((l-1)/3));

Games.g1={start(){
  const W=800,H=480;
  const carryLimit=1+getSk('g1_carry');
  const hasScan=getSk('g1_scan')>0;
  const hasSlow=getSk('g1_slow')>0;
  const hasLaser=getSk('g1_laser')>0;
  const guardLvl=getSk('g1_guard');

  let actHtml=`<div class="act-bar">`;
  if(hasSlow) actHtml+=`<button class="act-btn" id="act_g1_slow">🧊 Freno (45s)</button>`;
  if(hasLaser) actHtml+=`<button class="act-btn" id="act_g1_laser">⚡ Repelente (60s)</button>`;
  actHtml+=`</div>`;

  Shell.open('📦 Fábrica de Cajas',`<div class="rel"><canvas id="cv" width="${W}" height="${H}"></canvas>${actHtml}</div><div class="row" style="margin-top:8px"><button class="btn y sm" id="hb">💡 Pista</button><span class="msg" id="gm" style="flex:1;min-width:200px">WASD/Flechas para moverte. Lleva cajas al camión correcto.</span></div><div id="hint"></div>`);
  const cv=$('#cv'),ctx=cv.getContext('2d');
  let lvl=Math.max(1,S.prog.g1>3?S.prog.g1-2:1),del=0,stolen=0,t=0,spawnB=0,spawnT=4,over=false,flash=0,raf,showHint=false;
  let slowTimer=0, cdSlow=0, cdLaser=0;

  const LIM=5,keys={},pl={x:400,y:300,ko:0,carry:[],punch:0,fx:1};
  const boxes=[],thieves=[],pops=[];
  const ds=()=>TIERS[tierOf(lvl)];
  const trucks=()=>ds().map((d,i)=>({d,x:30+i*190,y:392,w:160,h:80}));
  const spd=()=>Math.min(250,55+lvl*16)*(slowTimer>0?0.75:1);
  const mkNum=()=>{const d=pick(ds());return d*rnd(2,Math.min(40,3+lvl*2))};
  const hud=()=>Shell.hud({Nivel:lvl,Entregadas:del,Robadas:`${stolen}/${LIM}`,Carga:`${pl.carry.length}/${carryLimit}`});hud();
  const say=(m,c)=>{const g=$('#gm');if(g){g.textContent=m;g.className='msg '+(c||'')}};

  if(hasSlow){
    $('#act_g1_slow').onclick=()=>{
      if(cdSlow>0||over)return;
      slowTimer=12;cdSlow=45;
      SFX.play('ok');UI.toast('🧊 ¡Freno de cinta activado (12s)!');
    };
  }
  if(hasLaser){
    $('#act_g1_laser').onclick=()=>{
      if(cdLaser>0||over)return;
      cdLaser=60;
      SFX.play('boom');
      thieves.forEach(th=>{
        th.st='stun';th.tm=3;
        pops.push({x:th.x,y:th.y-30,t:1,s:'⚡ ¡HUYE!'});
      });
      UI.toast('⚡ ¡Repelente Láser activado!');
    };
  }

  function renderHint(){
    const h=$('#hint');if(!h)return;if(!showHint){h.innerHTML='';return}
    let s=`<div class="hint"><b>Reglas de los camiones</b><div class="legend">${ds().map(d=>`<div>÷${d}: ${divRule(d).r}</div>`).join('')}</div>`;
    if(pl.carry.length>0){
      const topB=pl.carry[pl.carry.length-1];
      s+=`<b>Caja actual: ${topB.n}</b><div class="legend">${ds().map(d=>`<div>÷${d} → ${divRule(d).w(topB.n)}</div>`).join('')}</div>`;
    }else s+=`<div>Agarra una caja para revisar su divisibilidad.</div>`;
    h.innerHTML=s+'</div>';
  }
  $('#hb').onclick=()=>{showHint=!showHint;SFX.play('click');renderHint()};
  const kd=e=>{const k=e.key.toLowerCase();if('wasd'.includes(k)&&k.length===1||k.startsWith('arrow')){keys[k]=1;e.preventDefault()}};
  const ku=e=>{delete keys[e.key.toLowerCase()]};
  addEventListener('keydown',kd);addEventListener('keyup',ku);

  const hit=e=>{if(over)return;pl.punch=.2;SFX.play('hit');
    for(const th of thieves){if(Math.hypot(th.x-pl.x,th.y-pl.y)<95&&th.st!=='gone'){if(th.box){th.box.x=th.x;th.box.y=85;th.box.carried=false;th.box.thief=null;boxes.push(th.box);th.box=null}th.st='stun';th.tm=1.5+guardLvl;pops.push({x:th.x,y:th.y-30,t:.8,s:'¡POW!'})}}};
  cv.addEventListener('pointerdown',hit);
  Loop.add(()=>{cancelAnimationFrame(raf);removeEventListener('keydown',kd);removeEventListener('keyup',ku);over=true});

  function deliver(tr){
    if(pl.carry.length===0)return;
    const b=pl.carry.pop();
    if(b.n%tr.d===0){
      del++;Missions.track('g1',1);SFX.play('ok');pops.push({x:tr.x+80,y:tr.y,t:.9,s:'+1 ✔'});say(`${b.n} ÷ ${tr.d} ✔`,'ok');
      if(del%5===0){lvl++;S.prog.g1=Math.max(S.prog.g1,lvl);Store.save();pops.push({x:W/2,y:200,t:1.4,s:'¡NIVEL '+lvl+'!'});SFX.play('coin');}
    }else{
      pl.ko=3;SFX.play('bad');say(`${b.n} no es divisible entre ${tr.d}. ¡Noqueado 3s!`,'bad');showHint=true;
    }
    hud();renderHint();
  }
  function end(){over=true;SFX.play('boom');const c=del*2+lvl*3;Shell.end({title:'¡Fábrica completada!',lines:[`Cajas entregadas: ${del}`,`Nivel alcanzado: ${lvl}`],coins:c,again:()=>Games.g1.start()})}

  let last=performance.now();
  function step(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;if(over)return;t+=dt;
    if(slowTimer>0)slowTimer-=dt;
    if(cdSlow>0){cdSlow-=dt;const b=$('#act_g1_slow');if(b)b.textContent=cdSlow>0?`🧊 Freno (${Math.ceil(cdSlow)}s)`:'🧊 Freno (Listo)';if(b)b.disabled=cdSlow>0;}
    if(cdLaser>0){cdLaser-=dt;const b=$('#act_g1_laser');if(b)b.textContent=cdLaser>0?`⚡ Repelente (${Math.ceil(cdLaser)}s)`:'⚡ Repelente (Listo)';if(b)b.disabled=cdLaser>0;}

    if(pl.ko>0){pl.ko-=dt}else{const sp=230;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy){const l=Math.hypot(dx,dy);pl.x=clamp(pl.x+dx/l*sp*dt,24,W-24);pl.y=clamp(pl.y+dy/l*sp*dt,100,H-30);if(dx)pl.fx=dx}}
    pl.punch=Math.max(0,pl.punch-dt);
    spawnB-=dt;if(spawnB<=0){boxes.push({x:W+30,y:85,n:mkNum(),w:46});spawnB=Math.max(.6,2.2-lvl*.16)+Math.random()*.4}
    for(const b of boxes){if(!b.carried&&!b.thief)b.x-=spd()*dt}
    for(let i=boxes.length-1;i>=0;i--){if(boxes[i].x<-40&&!boxes[i].carried)boxes.splice(i,1)}

    if(pl.carry.length<carryLimit&&pl.ko<=0)for(const b of boxes){
      if(!b.carried&&!b.thief&&Math.hypot(b.x-pl.x,b.y-pl.y)<46){
        b.carried=true;pl.carry.push(b);boxes.splice(boxes.indexOf(b),1);SFX.play('click');hud();renderHint();break;
      }
    }
    if(pl.carry.length>0&&pl.ko<=0)for(const tr of trucks()){
      if(pl.x>tr.x&&pl.x<tr.x+tr.w&&pl.y>tr.y-20){deliver(tr);break}
    }

    spawnT-=dt;if(spawnT<=0&&thieves.filter(x=>x.st!=='gone').length<1+Math.floor(lvl/2)){thieves.push({x:rnd(100,W-80),y:H-120,st:'seek',box:null,tm:0});spawnT=Math.max(2,8-lvl*.8)+Math.random()*3}
    for(const th of thieves){
      if(th.st==='seek'){
        if(guardLvl>0&&Math.hypot(th.x-pl.x,th.y-pl.y)<80){
          th.st='stun';th.tm=guardLvl*2;pops.push({x:th.x,y:th.y-20,t:.8,s:'🐶 ¡GUARDIA!'});
        }
        const tg=boxes.filter(b=>!b.carried&&!b.thief).sort((a,b)=>Math.abs(a.x-th.x)-Math.abs(b.x-th.x))[0];
        if(!tg){th.y+=50*dt;if(th.y>H+40)th.st='gone'}else{const dx=tg.x-th.x,dy=tg.y+30-th.y,l=Math.hypot(dx,dy)||1,s=90+lvl*12;th.x+=dx/l*s*dt;th.y+=dy/l*s*dt;if(l<26){boxes.splice(boxes.indexOf(tg),1);th.box=tg;tg.thief=th;th.st='flee';flash=1.2;SFX.play('alarm');say('⚠ ¡LADRÓN! ¡Están robando una caja!','bad')}}
      }
      else if(th.st==='flee'){th.y-=110*dt;th.x+=(th.x>W/2?1:-1)*40*dt;if(th.y<-20){stolen++;th.st='gone';th.box=null;hud();SFX.play('bad');if(stolen>=LIM)end()}else{th.al=(th.al||0)-dt;if(th.al<=0){SFX.play('alarm');th.al=1;flash=Math.max(flash,.6)}}}
      else if(th.st==='stun'){th.tm-=dt;if(th.tm<=0){th.st='run'}}
      else if(th.st==='run'){th.y+=140*dt;if(th.y>H+40)th.st='gone'}
    }
    flash=Math.max(0,flash-dt);
    for(const p of pops)p.t-=dt;
    draw();raf=requestAnimationFrame(step);
  }

  function box(b,x,y){
    ctx.fillStyle='#c98f4a';ctx.fillRect(x-23,y-23,46,46);
    ctx.strokeStyle=hasScan?(b.n%2===0?'#43b77a':'#FFE34D'):'#8a5a22';
    ctx.lineWidth=hasScan?5:3;ctx.strokeRect(x-23,y-23,46,46);
    ctx.fillStyle='#fff3d0';ctx.fillRect(x-19,y-11,38,22);ctx.fillStyle='#26324d';
    ctx.font='700 '+(b.n>99?15:18)+'px Fredoka,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(b.n,x,y+1);
  }

  function draw(){
    ctx.fillStyle='#dbe8f6';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#c4d7ee';for(let i=0;i<8;i++)ctx.fillRect(i*110+((t*8)%110)-110,150,60,260);
    ctx.fillStyle='#4b5873';ctx.fillRect(0,60,W,50);ctx.strokeStyle='#8a97b3';ctx.lineWidth=3;
    for(let x=-((t*spd())%30);x<W;x+=30){ctx.beginPath();ctx.moveTo(x,62);ctx.lineTo(x,108);ctx.stroke()}
    boxes.forEach(b=>box(b,b.x,b.y));
    for(const tr of trucks()){ctx.fillStyle='#F4B3C2';ctx.fillRect(tr.x,tr.y,tr.w,tr.h);ctx.fillStyle='#FFE34D';ctx.fillRect(tr.x+tr.w-38,tr.y+10,28,26);ctx.fillStyle='#26324d';ctx.beginPath();ctx.arc(tr.x+34,tr.y+tr.h,12,0,7);ctx.arc(tr.x+tr.w-34,tr.y+tr.h,12,0,7);ctx.fill();ctx.font='700 30px Fredoka,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('÷'+tr.d,tr.x+60,tr.y+40)}
    for(const th of thieves){if(th.st==='gone')continue;ctx.font='44px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(th.st==='stun'?'😵':'🦹',th.x,th.y);if(th.box)box(th.box,th.x,th.y-38)}
    const sk=skinOf(S.pet.sp,S.pet.skin);ctx.save();ctx.translate(pl.x,pl.y);ctx.scale(pl.fx,1);if(pl.ko>0)ctx.rotate(Math.sin(t*20)*.2);const im=pimg(S.pet.sp);if(sk.f)try{ctx.filter=sk.f}catch(e){}if(im.complete&&im.naturalWidth)ctx.drawImage(im,-46,-46,92,92);ctx.filter='none';if(pl.ko>0){ctx.font='30px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText("😵",0,-46)}ctx.restore();
    if(pl.punch>0){ctx.strokeStyle='#ea5d72';ctx.lineWidth=5;ctx.beginPath();ctx.arc(pl.x,pl.y,70-pl.punch*150,0,7);ctx.stroke()}
    pl.carry.forEach((b,idx)=>box(b,pl.x,pl.y-44-(idx*20)));
    for(const p of pops){ctx.globalAlpha=clamp(p.t,0,1);ctx.fillStyle='#26324d';ctx.font='700 28px Fredoka,sans-serif';ctx.textAlign='center';ctx.fillText(p.s,p.x,p.y-(1-p.t)*30);ctx.globalAlpha=1}
  }
  raf=requestAnimationFrame(step);
}};

'use strict';
Games.g2={start(){
  const patBonus=[0,0.2,0.35,0.5][getSk('g2_pat')];
  const hasSlow=getSk('g2_slow')>0;
  const vipBonus=getSk('g2_vip')*0.15;
  const fastBonus=getSk('g2_fast')*0.2;
  const hasWarn=getSk('g2_warn')>0;

  let actHtml=hasSlow?`<div class="act-bar"><button class="act-btn" id="act_g2_slow">⏱ Camera Lenta (60s)</button></div>`:'';

  Shell.open('☕ Barista Caótico',`<div class="card rel" style="background:linear-gradient(var(--yellow),#fff3a0)">${actHtml}<div class="row" style="justify-content:space-between"><div style="text-align:center">${petHTML(96)}<small>Barista ${S.pet.name}</small></div><div style="flex:1;min-width:200px"><b>Reputación</b><div class="bar" id="repbar"><b id="rep"></b></div><p class="msg" id="gm">Haz clic en un cliente para leer su pedido.</p></div></div></div><div class="cust" id="cust"></div><div id="ordp"></div>`);
  let lvl=Math.max(1,S.prog.g2>3?S.prog.g2-2:1),rep=70,served=0,gain=0,sel=null,uid=0,over=false,iv;
  let slowTimer=0, cdSlow=0;
  const custs=[],FACES=['🧑','👩','👴','👵','🧔','👨‍🎤','🧒','🧑‍🍳'];
  const dec=()=>lvl<3?1:2;
  const fx=(a,d)=>Math.round(a*Math.pow(10,d))/Math.pow(10,d);

  const GEN={
    add(){const d=dec(),a=fx(rnd(15,100)/10,d),b=fx(rnd(15,100)/10,d);return{t:`Latte: ${a} ml leche + ${b} ml café. ¿Total?`,a:fx(a+b,2),h:[`Suma ${a} + ${b}`]}},
    mul(){const a=rnd(12,50)/10,k=rnd(2,5);return{t:`Azúcar: ${a}g por taza, ${k} tazas. ¿Total?`,a:fx(a*k,2),h:[`Multiplica ${a} × ${k}`]}},
    unit(){const L=rnd(1,5)/10,ml=rnd(20,200);return{t:`${L}L de leche + ${ml}ml café. ¿Total ml?`,a:fx(L*1000+ml,2),h:[`1L = 1000ml. ${L}L = ${L*1000}ml.`]}}
  };

  if(hasSlow){
    $('#act_g2_slow').onclick=()=>{
      if(cdSlow>0||over)return;
      slowTimer=15;cdSlow=60;
      SFX.play('ok');UI.toast('⏱ ¡Cámara lenta activada (15s)!');
    };
  }

  const hud=()=>{Shell.hud({Nivel:lvl,Atendidos:served,Monedas:'🪙 '+gain});const r=$('#rep');if(r){r.style.width=clamp(rep,0,100)+'%';r.parentNode.classList.toggle('low',rep<30)}};
  const say=(m,c)=>{const g=$('#gm');if(g){g.textContent=m;g.className='msg '+(c||'')}};

  function spawn(){
    if(custs.length>=4)return;
    const r=Math.random();
    const isVip=r < (0.1 + vipBonus);
    const isFast=Math.random() < fastBonus;
    const k=isVip?'vip':(r<0.3?'rush':'normal');
    const K={normal:{n:'',pay:1,rate:1,pat:60},rush:{n:'⏱ Con prisa',pay:1.3,rate:1.3,pat:45},vip:{n:'⭐ VIP',pay:2,rate:1.2,pat:50}}[k];
    const patVal=K.pat*(1+patBonus);
    custs.push({id:++uid,k,face:isVip?'🧑‍🎤':pick(FACES),pat:patVal,p:patVal,qs:isFast?[GEN.add()]:[GEN[pick(['add','mul','unit'])]()],qi:0,hl:0,rate:K.rate});
    render();
  }

  function render(){
    const c=$('#cust');if(!c)return;
    c.innerHTML=custs.map(u=>`<div class="cu ${u.k==='vip'?'vip':''} ${sel===u.id?'sel':''}" data-u="${u.id}"><div class="f">${u.face}</div><small>${u.k==='vip'?'VIP':'Cliente'}</small><div class="bar ${u.p/u.pat<.3?'low':''}"><b style="width:${u.p/u.pat*100}%"></b></div><small>${u.seen?'Leído':'Haz clic'}</small></div>`).join('')||'<small>Esperando clientes...</small>';
    $$('[data-u]',c).forEach(b=>b.onclick=()=>{sel=+b.dataset.u;const u=custs.find(x=>x.id===sel);u.seen=true;SFX.play('click');render();order()});
  }

  function order(){
    const u=custs.find(x=>x.id===sel),p=$('#ordp');if(!u){p.innerHTML='';return}
    const q=u.qs[u.qi];
    p.innerHTML=`<div class="order"><b>${u.face} Pedido ${u.qi+1}/${u.qs.length}</b><p style="font-size:18px;margin:8px 0">${q.t}</p><div class="row"><input class="inp" id="ans" inputmode="decimal" autocomplete="off" placeholder="respuesta"><button class="btn y" id="go">Servir</button><button class="btn b sm" id="hb">💡 Pista</button></div><div id="hh">${Hint.html(q.h,u.hl)}</div><div id="warn_msg" style="color:orange;font-weight:700;margin-top:4px"></div></div>`;
    const a=$('#ans');a.focus();
    if(hasWarn){
      a.oninput=()=>{
        const val=num(a.value);
        if(!isNaN(val)&&Math.abs(val-q.a)<=0.1&&Math.abs(val-q.a)>0.001){
          $('#warn_msg').textContent='⚠️ ¡Casi! Revisa bien el redondeo.';
        }else $('#warn_msg').textContent='';
      };
    }
    const go=()=>submit(u,num(a.value));$('#go').onclick=go;a.onkeydown=e=>{if(e.key==='Enter')go()};
    $('#hb').onclick=()=>{u.hl=Math.min(3,u.hl+1);SFX.play('click');$('#hh').innerHTML=Hint.html(q.h,u.hl)};
  }

  function submit(u,v){
    if(isNaN(v))return;const q=u.qs[u.qi];
    if(Math.abs(v-q.a)<=.011){
      SFX.play('ok');u.qi++;u.hl=0;
      if(u.qi>=u.qs.length){
        const pay=Math.round((8+lvl*2)*(u.k==='vip'?2:1));
        gain+=pay;rep=clamp(rep+6,0,100);served++;Missions.track('g2',1);
        custs.splice(custs.indexOf(u),1);sel=null;say(`¡Atendido! +${pay} 🪙`,'ok');SFX.play('coin');
        if(served%4===0){lvl++;S.prog.g2=Math.max(S.prog.g2,lvl);Store.save();}
        $('#ordp').innerHTML='';
      }else order();
    }else{
      SFX.play('bad');rep=clamp(rep-4,0,100);say('Incorrecto. Inténtalo otra vez.','bad');order();
    }
    hud();render();if(rep<=0)end();
  }

  function end(){if(over)return;over=true;clearInterval(iv);SFX.play('boom');Shell.end({title:'Cafetería cerrada',lines:[`Clientes atendidos: ${served}`,`Nivel: ${lvl}`],coins:gain,again:()=>Games.g2.start()})}

  iv=setInterval(()=>{
    if(over)return;
    if(slowTimer>0)slowTimer-=.1;
    if(cdSlow>0){cdSlow-=.1;const b=$('#act_g2_slow');if(b)b.textContent=cdSlow>0?`⏱ Cámara Lenta (${Math.ceil(cdSlow)}s)`:'⏱ Cámara Lenta (Lista)';if(b)b.disabled=cdSlow>0;}

    for(const u of [...custs]){
      u.p-=.1*u.rate*(slowTimer>0?0.5:1);
      if(u.p<=0){custs.splice(custs.indexOf(u),1);rep=clamp(rep-8,0,100);SFX.play('bad');if(sel===u.id){sel=null;$('#ordp').innerHTML=''}hud();render();if(rep<=0)return end()}
    }
    if(Math.random()<0.05)spawn();
    $$('#cust .cu').forEach((d,i)=>{const u=custs[i];if(u){const b=$('.bar>b',d);b.style.width=u.p/u.pat*100+'%';b.parentNode.classList.toggle('low',u.p/u.pat<.3)}});
  },100);
  Loop.add(()=>{over=true;clearInterval(iv)});
  hud();spawn();render();
}};

'use strict';
Games.g3={start(){
  const tolBonus=getSk('g3_tol')*0.2;
  const hasFreeze=getSk('g3_freeze')>0;
  const insulPen=5-(getSk('g3_insul')*1.5);
  const hasSub=getSk('g3_sub')>0;
  const hasFuse=getSk('g3_fuse')>0;

  let actHtml=`<div class="act-bar">`;
  if(hasFreeze) actHtml+=`<button class="act-btn" id="act_g3_freeze">🧊 Congelar (45s)</button>`;
  if(hasFuse) actHtml+=`<button class="act-btn" id="act_g3_fuse">❤️ Fusible (90s)</button>`;
  actHtml+=`</div>`;

  Shell.open('🔌 Hacker de Cables',`<div class="card rel" id="board">${actHtml}<div class="bar" id="tbar"><b id="tb" style="width:100%"></b></div><div id="svgw" style="margin:10px 0"></div><p id="stmt" style="font-size:19px;margin:0 0 10px"></p><div class="row"><input class="inp" id="ans" inputmode="decimal" autocomplete="off" placeholder="longitud"><button class="btn y" id="go">Conectar</button><button class="btn b sm" id="hb">💡 Pista</button></div><div id="hh"></div><p class="msg" id="gm"></p></div>`);
  
  let lvl=Math.max(1,S.prog.g3>3?S.prog.g3-2:1),solved=0,lives=3,tl=0,tmax=0,over=false,cur=null,qte=null,iv,hl=0;
  let freezeTimer=0, cdFreeze=0, cdFuse=0;
  const L=['A','B','C','D'];
  const sc=()=>1+Math.floor(lvl/2);

  const GEN=[
    ()=>{const a=rnd(2,8)*sc(),b=rnd(2,8)*sc();return{n:3,seg:[a,b],tot:a+b,t:`AB = ${a} cm y BC = ${b} cm. Halla AC.`,a:a+b,h:[`AC = AB + BC = ${a} + ${b}`]}},
    ()=>{const a=rnd(3,10)*sc(),b=rnd(2,8)*sc();return{n:3,seg:[a,'?'],tot:a+b,t:`AC = ${a+b} cm y AB = ${a} cm. Halla BC.`,a:b,h:[`BC = AC − AB = ${a+b} − ${a}`]}}
  ];

  if(hasFreeze){
    $('#act_g3_freeze').onclick=()=>{
      if(cdFreeze>0||over)return;
      freezeTimer=8;cdFreeze=45;
      SFX.play('ok');UI.toast('🧊 ¡Tiempo congelado por 8s!');
    };
  }
  if(hasFuse){
    $('#act_g3_fuse').onclick=()=>{
      if(cdFuse>0||over||lives>=3)return;
      lives++;cdFuse=90;
      SFX.play('coin');hud();UI.toast('❤️ ¡Vida recuperada!');
    };
  }

  const draw=p=>{
    const W=700,x0=50,dx=(W-100)/(p.n-1),pts=[...Array(p.n)].map((_,i)=>x0+i*dx);
    let s=`<svg viewBox="0 0 ${W} 150" style="width:100%;max-height:170px"><rect width="${W}" height="150" rx="16" fill="#26324d"/>`;
    for(let i=0;i<p.n-1;i++){
      s+=`<line x1="${pts[i]}" y1="90" x2="${pts[i+1]}" y2="90" stroke="#FFE34D" stroke-width="8" stroke-linecap="round"/><text x="${(pts[i]+pts[i+1])/2}" y="118" fill="#fff" font-size="20" font-family="Fredoka,sans-serif" text-anchor="middle">${p.seg[i]}</text>`;
      if(hasSub){
        s+=`<line x1="${(pts[i]+pts[i+1])/2}" y1="82" x2="${(pts[i]+pts[i+1])/2}" y2="98" stroke="#F4B3C2" stroke-width="4"/>`;
      }
    }
    s+=`<path d="M${pts[0]} 75 Q${(pts[0]+pts[p.n-1])/2} 20 ${pts[p.n-1]} 75" fill="none" stroke="#A8C5E6" stroke-width="4" stroke-dasharray="8 8"/><text x="${W/2}" y="34" fill="#A8C5E6" font-size="22" font-family="Fredoka,sans-serif" text-anchor="middle">Total = ${p.tot}</text>`;
    pts.forEach((x,i)=>{s+=`<circle cx="${x}" cy="90" r="14" fill="#F4B3C2"/><text x="${x}" y="96" font-size="18" font-weight="700" font-family="Fredoka,sans-serif" text-anchor="middle" fill="#26324d">${L[i]}</text>`});
    return s+'</svg>';
  };

  const say=(m,c)=>{const g=$('#gm');if(g){g.textContent=m;g.className='msg '+(c||'')}};
  const hud=()=>Shell.hud({Nivel:lvl,Circuitos:solved,Vidas:'❤️'.repeat(lives)||'💀'});

  function next(){
    cur=pick(GEN)();hl=0;
    $('#svgw').innerHTML=draw(cur);$('#stmt').textContent=cur.t;$('#ans').value='';$('#ans').focus();
    tmax=tl=Math.max(20,50-lvl*2);hud();
  }

  function submit(){
    if(over||qte)return;const v=num($('#ans').value);if(isNaN(v))return;
    if(Math.abs(v-cur.a)<=(0.011+tolBonus)){
      SFX.play('ok');solved++;Missions.track('g3',1);say('¡Circuito reparado!','ok');
      if(solved%2===0){lvl++;S.prog.g3=Math.max(S.prog.g3,lvl);Store.save();}
      next();
    }else{
      SFX.play('short');tl-=3;say('Cálculo incorrecto (-3s)','bad');
    }
  }

  function startQTE(){
    const b=$('#board'),o=mk(`<div class="shortc"><button class="btn" id="sp" style="font-size:24px">⚡ ¡ZAP!</button></div>`);b.append(o);qte={o,t:2.2};
    $('#sp',o).onclick=()=>{qte.o.remove();qte=null;SFX.play('ok');say('¡Chispa esquivada!','ok')};
  }

  $('#go').onclick=submit;$('#ans').onkeydown=e=>{if(e.key==='Enter')submit()};
  $('#hb').onclick=()=>{hl=Math.min(3,hl+1);SFX.play('click');$('#hh').innerHTML=Hint.html(cur.h,hl)};

  function end(){over=true;clearInterval(iv);SFX.play('boom');Shell.end({title:'Placa quemada',lines:[`Circuitos: ${solved}`,`Nivel: ${lvl}`],coins:solved*4+lvl*2,again:()=>Games.g3.start()})}

  iv=setInterval(()=>{
    if(over)return;
    if(cdFreeze>0){cdFreeze-=.1;const b=$('#act_g3_freeze');if(b)b.textContent=cdFreeze>0?`🧊 Congelar (${Math.ceil(cdFreeze)}s)`:'🧊 Congelar (Listo)';if(b)b.disabled=cdFreeze>0;}
    if(cdFuse>0){cdFuse-=.1;const b=$('#act_g3_fuse');if(b)b.textContent=cdFuse>0?`❤️ Fusible (${Math.ceil(cdFuse)}s)`:'❤️ Fusible (Listo)';if(b)b.disabled=cdFuse>0;}

    if(qte){
      qte.t-=.1;
      if(qte.t<=0){
        qte.o.remove();qte=null;tl-=insulPen;SFX.play('bad');
        say(`La chispa dañó la placa: -${insulPen}s`,'bad');
      }
    }else if(Math.random()<0.03)startQTE();

    if(freezeTimer>0)freezeTimer-=.1;
    else tl-=.1;

    $('#tb').style.width=clamp(tl/tmax*100,0,100)+'%';
    if(tl<=0){lives--;SFX.play('bad');if(lives<=0)return end();next()}
  },100);

  Loop.add(()=>{over=true;clearInterval(iv)});
  next();
}};

'use strict';
Games.g4={start(){
  const transLvl=getSk('g4_trans');
  const hasShield=getSk('g4_shield')>0;
  const hasSimp=getSk('g4_simp')>0;
  const hasSkip=getSk('g4_skip')>0;
  const bonusCoinMult=1+(getSk('g4_bonus')*0.25);

  let actHtml=`<div class="act-bar">`;
  if(hasSimp) actHtml+=`<button class="act-btn" id="act_g4_simp">🔢 Simplificar (60s)</button>`;
  if(hasSkip) actHtml+=`<button class="act-btn" id="act_g4_skip">⏭ Saltar (1 uso)</button>`;
  actHtml+=`</div>`;

  Shell.open('👽 Escape Room Galáctico 4D',`<div class="card rel" id="lab" style="background:linear-gradient(160deg,#26324d,#3d2f6b);color:#fff">${actHtml}<div class="row" style="align-items:flex-start"><div style="text-align:center"><div class="alien" id="al">👽</div></div><div style="flex:1;min-width:200px"><div id="say" style="background:#fff;color:#26324d;border-radius:16px;padding:10px 14px;font-weight:800">¡Abre mis puertas!</div></div></div><div style="display:flex;gap:18px;align-items:center;margin-top:12px"><div id="mach" style="font-size:40px">🔑</div><div><b>Yunque láser:</b><div class="bar" style="margin-top:6px;width:180px"><b id="hpb" style="width:100%"></b></div></div></div></div><div class="card"><div id="stage" style="font-weight:800;color:var(--pink-d)"></div><p id="q" style="font-size:19px;margin:8px 0"></p><div class="row"><input class="inp" id="ans" inputmode="decimal" autocomplete="off" placeholder="respuesta"><button class="btn y" id="go">Disparar</button><button class="btn b sm" id="hb">💡 Pista</button></div><div id="hh"></div><p class="msg" id="gm"></p></div>`);
  
  let lvl=Math.max(1,S.prog.g4>3?S.prog.g4-2:1),hp=3,solved=0,cur=null,over=false,hl=0,usedShield=false;
  let cdSimp=0, usedSkip=false;

  const GEN={
    direct(scale=1){const k=rnd(2,4),r=rnd(2,5),k2=k*rnd(2,4);return{s:'Regla de tres directa',t:`${k/scale} llaves abren ${k*r/scale} puertas. ¿Cuántas abren ${k2/scale} llaves?`,a:k2*r,h:[`1 llave = ${r} puertas.`]}},
    inverse(scale=1){const w=rnd(2,4),c=rnd(2,5),w2=w*2;return{s:'Regla de tres inversa',t:`${w} láseres demoran ${c*2} min. ¿Cuántos min demoran ${w2} láseres?`,a:c,h:[`Más láseres = menos tiempo.`]}}
  };

  if(hasSimp){
    $('#act_g4_simp').onclick=()=>{
      if(cdSimp>0||over)return;
      cdSimp=60;cur=GEN.direct(2);
      $('#q').textContent=cur.t;SFX.play('ok');UI.toast('🔢 Cifras simplificadas');
    };
  }
  if(hasSkip){
    $('#act_g4_skip').onclick=()=>{
      if(usedSkip||over)return;
      usedSkip=true;$('#act_g4_skip').disabled=true;
      SFX.play('coin');next();UI.toast('⏭ Problema saltado');
    };
  }

  const hud=()=>{Shell.hud({Nivel:lvl,Puertas:solved,PV:'❤️'.repeat(hp)||'💀'});const b=$('#hpb');if(b)b.style.width=hp/3*100+'%';};

  function next(){
    cur=pick([GEN.direct,GEN.inverse])();hl=transLvl;
    $('#stage').textContent=cur.s;$('#q').textContent=cur.t;$('#ans').value='';$('#ans').focus();
    if(hl>0) $('#hh').innerHTML=Hint.html(cur.h,hl);
    hud();
  }

  function submit(){
    if(over)return;const v=num($('#ans').value);if(isNaN(v))return;
    if(Math.abs(v-cur.a)<.011){
      solved++;Missions.track('g4',1);SFX.play('ok');
      const bonus=hl===0?Math.round(10*bonusCoinMult):10;
      earn(bonus,1);
      $('#gm').textContent=`¡Puerta abierta! (+${bonus}🪙)`;$('#gm').className='msg ok';
      if(solved%2===0){lvl++;S.prog.g4=Math.max(S.prog.g4,lvl);Store.save();}
      next();
    }else{
      if(hasShield&&!usedShield){
        usedShield=true;SFX.play('ok');
        UI.toast('🛡 Escudo Cuántico evitó la pérdida de vida.');
      }else{
        hp--;SFX.play('short');$('#gm').textContent='¡Fallaste! -1 vida';$('#gm').className='msg bad';
        if(hp<=0)return end();
      }
      next();
    }
  }

  function end(){over=true;SFX.play('boom');Shell.end({title:'Fin del escape',lines:[`Puertas: ${solved}`,`Nivel: ${lvl}`],coins:solved*5+lvl*2,again:()=>Games.g4.start()})}

  const iv=setInterval(()=>{
    if(over)return;
    if(cdSimp>0){cdSimp-=.1;const b=$('#act_g4_simp');if(b)b.textContent=cdSimp>0?`🔢 Simplificar (${Math.ceil(cdSimp)}s)`:'🔢 Simplificar (Listo)';if(b)b.disabled=cdSimp>0;}
  },100);

  $('#go').onclick=submit;$('#ans').onkeydown=e=>{if(e.key==='Enter')submit()};
  $('#hb').onclick=()=>{hl=Math.min(3,hl+1);SFX.play('click');$('#hh').innerHTML=Hint.html(cur.h,hl)};

  Loop.add(()=>{over=true;clearInterval(iv)});
  next();
}};

'use strict';
Games.pvp={start(){
  const lvl=S.prog.pvp,eSp=pick(Object.keys(PETS));
  const mkF=(sp,lv)=>{const s=Pet.stats(sp,lv);return{sp,lv,hp:s.hp,max:s.hp,atk:s.atk,def:s.def,spd:s.spd,type:PETS[sp].type}};
  const P=mkF(S.pet.sp,S.pet.lvl),E=mkF(eSp,lvl);
  let busy=false,over=false,round=1;

  Shell.open('⚔️ Arena PVP',`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))"><div class="card" id="pp" style="text-align:center"></div><div class="card" id="ep" style="text-align:center"></div></div><div class="card"><b>Selecciona un ataque</b><div class="cards" id="hand" style="margin-top:8px"></div></div>`);

  function panels(){
    $('#pp').innerHTML=`${petHTML(90,{showBadge:true})}<b>${S.pet.name}</b><div class="bar"><b style="width:${P.hp/P.max*100}%"></b></div><small>PV ${r1(P.hp)}/${P.max}</small>`;
    $('#ep').innerHTML=`${petHTML(90,{sp:E.sp})}<b>Rival</b><div class="bar"><b style="width:${E.hp/E.max*100}%"></b></div><small>PV ${r1(E.hp)}/${E.max}</small>`;
    Shell.hud({Nivel:lvl,Turno:round});
  }

  function hand(){
    $('#hand').innerHTML=S.own.cards.map(id=>CARD[id]).filter(Boolean).map(c=>`<button class="mv ${c.t}" data-c="${c.id}"><b>${TYPE[c.t].e} ${c.n}</b><small>${cardDesc(c)}</small></button>`).join('');
    $$('[data-c]',$('#hand')).forEach(b=>b.onclick=()=>play(CARD[b.dataset.c]));
  }

  function play(c){
    if(busy||over)return;busy=true;
    const dmg=c.base+P.atk;
    E.hp=Math.max(0,E.hp-dmg);SFX.play('hit');
    panels();
    if(E.hp<=0){
      over=true;S.prog.pvp=Math.max(S.prog.pvp,lvl+1);Store.save();
      return Shell.end({title:'¡Victoria!',lines:[`Derrotaste al rival.`],coins:30+lvl*5,again:()=>Games.pvp.start()});
    }
    setTimeout(()=>{
      P.hp=Math.max(0,P.hp-(6+lvl*2));SFX.play('bad');panels();
      if(P.hp<=0){
        over=true;
        return Shell.end({title:'Derrota',lines:[`Tu mascota se desmayó.`],coins:10,again:()=>Games.pvp.start()});
      }
      round++;busy=false;
    },600);
  }

  panels();hand();
}};

try{App.init()}catch(e){document.getElementById("view").textContent="Error: "+e.message}
</script>
